name: Auto Generate 1000 C++ Examples & Update README

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Question & README Generator Script
        run: python generate_cpp.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cpp-examples/ README.md
          git diff --staged --quiet || git commit -m "Auto-generated 1000 C++ questions & updated README table"
          git push
